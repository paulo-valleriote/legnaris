services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_go
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  migrate:
    image: migrate/migrate:v4.18.3
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/database/migrations:/migrations:ro

volumes:
  mongo_data: