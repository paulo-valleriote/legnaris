# golangci-lint v2 configuration.
# See: https://golangci-lint.run/docs/configuration/
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck       # unchecked errors
    - govet          # suspicious constructs (incl. copylocks, lostcancel)
    - ineffassign    # ineffective assignments
    - staticcheck    # static analysis (bugs, dead code, leaks)
    - unused         # unused code
    - gocyclo        # cyclomatic complexity
    - dupl           # duplicated code blocks
    - goconst        # repeated string literals
    - forbidigo      # banned identifiers (idgen, shared json, logger)
    - errorlint      # error wrapping, comparison and type assertions
    - bodyclose      # unclosed HTTP response bodies
    - noctx          # HTTP requests without a context
    - testifylint    # testify usage
  settings:
    gocyclo:
      # Threshold for cyclomatic complexity (see AGENTS.md "PR Review Checklist").
      min-complexity: 15
    dupl:
      threshold: 150
    goconst:
      min-len: 3
      min-occurrences: 3
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^uuid\.(New|NewString|Must)$'
          msg: "use idgen.New"
        - pattern: '^json\.(Unmarshal|NewDecoder)$'
          msg: "decode through backend/shared/json"
        - pattern: '^fmt\.Print(f|ln)?$'
          msg: "log through backend/shared/logger"
        - pattern: '^println$'
          msg: "log through backend/shared/logger"
    testifylint:
      enable-all: false
      enable:
        - empty
        - error-is-as
        - expected-actual
        - len
        - require-error
  exclusions:
    # Skip generated files (mockery mocks carry "Code generated ... DO NOT EDIT.").
    generated: lax
    presets:
      - comments
    # The web client's dependencies ship Go sources (e.g. flatted) that are not ours to lint.
    paths:
      - web/node_modules
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gocyclo
          - goconst
      # Tests may decode fixtures with encoding/json and print diagnostics.
      - path: _test\.go
        linters:
          - forbidigo
        text: decode through backend/shared/json
      - path: _test\.go
        linters:
          - forbidigo
        text: log through backend/shared/logger
      # The two shared wrappers are the only places allowed to touch the raw APIs.
      - path: backend/shared/idgen/
        linters:
          - forbidigo
        text: use idgen\.New
      - path: backend/shared/json/
        linters:
          - forbidigo
        text: decode through backend/shared/json
      # Entry points own stdout: structured logging starts behind backend/shared/logger.
      - path: backend/cmd/
        linters:
          - forbidigo
        text: log through backend/shared/logger

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
