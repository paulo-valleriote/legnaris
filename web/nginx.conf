# Static host for the built PWA, reached only through Traefik on the `edge`
# network. Traefik terminates the edge and applies the `web-security-headers`
# middleware (CSP and companions) to the web router, so this server adds caching
# and the SPA fallback (FND-08) and nothing else.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Container-local liveness probe for the compose healthcheck; served without
    # touching the filesystem.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Filenames are content-hashed, so a new build always lands on a new URL and
    # the old ones can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell, the service worker, and the manifest decide which hashed assets
    # a client asks for next, so caching them would pin a client to asset names
    # a later build has already pruned.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Written from the container environment at start (docker-entrypoint.d), so it
    # changes between deployments of the same image and must never be cached.
    location = /config.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Deep links resolve to the shell before the service worker exists.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
