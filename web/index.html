<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP is delivered as an HTTP header by the origin (Traefik
         `web-security-headers`); a meta tag cannot carry frame-ancestors or the
         reporting endpoints and would duplicate the policy (POL-02, F10). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Legnaris</title>
    <meta name="description" content="Legnaris character sheet workspace." />
    <meta name="theme-color" content="#efe6d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/geist/Geist-Variable.woff2"
    />
    <script src="/theme-init.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon.ico" type="image/x-icon" sizes="any" />
    <link rel="icon" href="/icons/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/icons/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-48x48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
