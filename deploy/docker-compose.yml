# =============================================================================
# Legnaris — production stack (single VPS, docker-compose)
# =============================================================================
# NOTE: the project name is deliberately "legnaris-prod" so its volumes and
# networks stay scoped to this deployment.
# Usage:
#   cp .env.example .env     # then fill every replace_me value
#   docker compose up -d --build
#
# Domains:
#   api.legnaris.com.br  -> app (public API, no auth)
#   ops.legnaris.com.br  -> Grafana/Prometheus/Mongo Express (GitHub OAuth)
#     /grafana, /prometheus, /mongo, /oauth2/callback
#
# Local development (via Cloudflare Tunnel):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# =============================================================================

name: legnaris-prod

networks:
  edge:
  internal:

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:
  loki_data:
  letsencrypt:

services:
  # ---- Edge router + TLS ----------------------------------------------------
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
      # TLS is production-only: the shared traefik.yml defines the plain-HTTP
      # `web` and internal `metrics` entrypoints; these flags add HTTPS.
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certResolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpChallenge.entryPoint=web
    environment:
      API_DOMAIN: ${API_DOMAIN}
      OPS_DOMAIN: ${OPS_DOMAIN}
      TRAEFIK_ENTRYPOINT: websecure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    networks:
      - edge
      - internal
    depends_on:
      - oauth2-proxy

  # ---- GitHub OAuth gate ----------------------------------------------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.0
    restart: unless-stopped
    # Configured via OAUTH2_PROXY_* env vars so the local override can flip a
    # single flag (OAUTH2_PROXY_COOKIE_SECURE) without duplicating the list.
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_EMAIL_DOMAIN: "*"
      OAUTH2_PROXY_GITHUB_USER: ${GITHUB_USER}
      OAUTH2_PROXY_CLIENT_ID: ${GITHUB_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 24h
      OAUTH2_PROXY_UPSTREAM: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REDIRECT_URL: https://${OPS_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAIN: ${OPS_DOMAIN}
      OAUTH2_PROXY_SCOPE: "user:email,read:org"
    networks:
      - edge

  # ---- Application ----------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: legnaris-app:local
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_NAME: legnaris
      # MONGO_APP_PASSWORD is embedded verbatim in the URI below; see
      # deploy/.env.example for the password requirements.
      DATABASE_URI: mongodb://legnaris_app:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}@mongodb:27017/legnaris
      DATABASE_NAME: legnaris
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    networks:
      - edge
      - internal
    depends_on:
      mongodb:
        condition: service_healthy

  # ---- Database -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      # Exposed to the init script in /docker-entrypoint-initdb.d.
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_EXPORTER_PASSWORD: ${MONGO_EXPORTER_PASSWORD}
      MONGO_VIEW_PASSWORD: ${MONGO_VIEW_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet -u root -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'db.adminCommand("ping").ok' | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    restart: unless-stopped
    command:
      - --mongodb.uri=mongodb://legnaris_exporter:${MONGO_EXPORTER_PASSWORD}@mongodb:27017/admin
    networks:
      - internal
    depends_on:
      mongodb:
        condition: service_healthy

  # ---- Observability ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Bound the TSDB so prometheus_data does not grow without limit.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=20GB
      - --web.external-url=https://${OPS_DOMAIN}/prometheus
      - --web.route-prefix=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - internal

  alloy:
    image: grafana/alloy:v1.17.1
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    networks:
      - internal
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${OPS_DOMAIN}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - internal
    depends_on:
      - prometheus
      - loki

  # ---- Database UI ------------------------------------------------------------
  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://legnaris_view:${MONGO_VIEW_PASSWORD}@mongodb:27017/legnaris
      ME_CONFIG_SITE_BASEURL: /mongo
      # Edge OAuth is the primary gate; basic auth adds defense in depth.
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    networks:
      - internal
    depends_on:
      mongodb:
        condition: service_healthy
