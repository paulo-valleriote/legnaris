# =============================================================================
# Legnaris — production stack (single VPS, docker-compose)
# =============================================================================
# NOTE: the project name is deliberately "legnaris-prod" so its volumes and
# networks stay scoped to this deployment.
# Usage:
#   cp .env.example .env     # then fill every replace_me value
#   docker compose up -d --build
#
# Domains:
#   api-legnaris.paulovalleriote.io  -> app (public API, no auth)
#   legnaris.paulovalleriote.io  -> web (public PWA client, no auth)
#   ops-legnaris.paulovalleriote.io  -> Grafana/Prometheus/Mongo Express/RabbitMQ console (GitHub OAuth)
#     /grafana, /prometheus, /mongo, /rabbitmq, /oauth2/callback
#
# Production deploys run prebuilt images via docker-compose.vps.yml (see
# vps/deploy.sh); local development uses `make dev`.
# =============================================================================

name: legnaris-prod

networks:
  edge:
  internal:

volumes:
  mongo_data:
  mongo_keyfile:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  loki_data:
  letsencrypt:

services:
  # ---- Edge router + TLS ----------------------------------------------------
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    # Traefik reads ONE static source: a --configFile makes it ignore every CLI
    # flag, which silently dropped the `websecure` entrypoint and the ACME
    # resolver. Everything is therefore configured by flags (so ${ACME_EMAIL}
    # can be interpolated). Routing comes from the file provider only; the
    # Docker socket is deliberately not mounted.
    command:
      - --global.sendAnonymousUsage=false
      - --entrypoints.web.address=:80
      - --entrypoints.metrics.address=:8082
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --metrics.prometheus.entryPoint=metrics
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
      - --log.level=INFO
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certResolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpChallenge.entryPoint=web
    environment:
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
      OPS_DOMAIN: ${OPS_DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    networks:
      - edge
      - internal
    depends_on:
      - oauth2-proxy

  # ---- GitHub OAuth gate ----------------------------------------------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.0
    restart: unless-stopped
    # Note: email-domain doesn't work via env var in v7.8.0 (array flag parsing bug),
    # so we pass it via command. The rest use env vars so the local override can
    # flip a single flag (OAUTH2_PROXY_COOKIE_SECURE) without duplicating the list.
    command:
      - --email-domain=*
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_GITHUB_USER: ${GITHUB_USER}
      OAUTH2_PROXY_CLIENT_ID: ${GITHUB_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 24h
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REDIRECT_URL: https://${OPS_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAIN: ${OPS_DOMAIN}
      OAUTH2_PROXY_SCOPE: "user:email,read:org"
    networks:
      - edge

  # ---- Application ----------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: legnaris-app:local
    restart: unless-stopped
    # Must exceed the sum of the shutdown budgets the app spends in sequence:
    # SHUTDOWN_TIMEOUT for HTTP (5s), DATABASE_CLOSE_TIMEOUT for MongoDB (5s)
    # and the event publisher drain (5s). A shorter grace makes Docker
    # SIGKILL the app mid-drain.
    stop_grace_period: 20s
    environment:
      PORT: "8080"
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-5s}
      APP_NAME: legnaris
      # MONGO_APP_PASSWORD is embedded verbatim in the URI below; see
      # deploy/.env.example for the password requirements.
      DATABASE_URI: mongodb://legnaris_app:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}@mongodb:27017/legnaris?replicaSet=rs0&retryWrites=true&authSource=legnaris
      DATABASE_NAME: legnaris
      DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-20}
      DATABASE_MIN_POOL_SIZE: ${DATABASE_MIN_POOL_SIZE:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Access tokens are signed with HMAC-SHA256; the app refuses to boot
      # without JWT_SECRET. The TTLs/cost default to the app's own values
      # (15m / 720h / 12) and can be overridden per deployment.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-720h}
      AUTH_BCRYPT_COST: ${AUTH_BCRYPT_COST:-12}
      # Optional trusted proxy set for client-address resolution. Unset keeps
      # the app default (loopback + private + link-local); a comma-separated
      # CIDR list replaces the non-loopback portion.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # Shared rate-limit store: every replica counts attempts in this Redis, so
      # the configured cap holds across replicas. Empty falls back to the
      # per-process limiter (cap applies per replica). The app does not wait
      # for Redis: an outage fails open to the per-process limiter.
      REDIS_URL: ${REDIS_URL-redis://redis:6379/0}
      # Best-effort domain events are published by the API. The
      # broker is optional at boot: the API serves requests while RabbitMQ is
      # down and counts the events it drops. The email relay and worker are the
      # only processes that consume the email settings (EML-14).
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://legnaris:${RABBITMQ_PASSWORD}@rabbitmq:5672/legnaris}
      # Optional billing settings (LGN-211). Empty keeps billing unconfigured.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_USD: ${STRIPE_PRICE_ID_USD:-}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-}
      # Optional email-delivery settings. The API records send intentions but
      # never contacts the provider, so none of these is required to boot.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_SEND_TIMEOUT: ${EMAIL_SEND_TIMEOUT:-10s}
      EMAIL_OUTBOX_RETENTION: ${EMAIL_OUTBOX_RETENTION:-168h}
      # Character generation gates (LGN-186). The API only reserves
      # jobs and enforces the kill-switch, the daily cap and the rate limits;
      # the LLM credentials live in the worker, which runs the jobs.
      GENERATION_ENABLED: ${GENERATION_ENABLED:-false}
      GENERATION_DAILY_CAP: ${GENERATION_DAILY_CAP:-200}
      GENERATION_CREATE_RATE_LIMIT_ATTEMPTS: ${GENERATION_CREATE_RATE_LIMIT_ATTEMPTS:-5}
      GENERATION_CREATE_RATE_LIMIT_WINDOW: ${GENERATION_CREATE_RATE_LIMIT_WINDOW:-1m}
      GENERATION_READ_RATE_LIMIT_ATTEMPTS: ${GENERATION_READ_RATE_LIMIT_ATTEMPTS:-30}
      GENERATION_READ_RATE_LIMIT_WINDOW: ${GENERATION_READ_RATE_LIMIT_WINDOW:-1m}
      # The OTP digest key is required: the API itself digests codes, so an
      # absent or too-short value must fail the boot rather than weaken every
      # code. It must differ from JWT_SECRET.
      EMAIL_CODE_SECRET: ${EMAIL_CODE_SECRET:?EMAIL_CODE_SECRET is required}
      # Optional challenge settings; the app defaults are 10m / 30m / 60s / 5 /
      # 80 / 1h / 10.
      AUTH_OTP_TTL: ${AUTH_OTP_TTL:-10m}
      AUTH_OTP_CEILING: ${AUTH_OTP_CEILING:-30m}
      AUTH_OTP_RESEND_COOLDOWN: ${AUTH_OTP_RESEND_COOLDOWN:-60s}
      AUTH_OTP_MAX_ATTEMPTS: ${AUTH_OTP_MAX_ATTEMPTS:-5}
      AUTH_OTP_DAILY_SEND_CAP: ${AUTH_OTP_DAILY_SEND_CAP:-80}
      AUTH_OTP_RESEND_CAP_RATIO: ${AUTH_OTP_RESEND_CAP_RATIO:-0.30}
      AUTH_OTP_USER_WINDOW: ${AUTH_OTP_USER_WINDOW:-1h}
      AUTH_OTP_USER_LIMIT: ${AUTH_OTP_USER_LIMIT:-10}
      # Registration limits (per address, per canonical e-mail) and the
      # disposable-domain check. The check is forced on in production by the
      # app itself, whatever this value says (LGN-151, D7).
      AUTH_REGISTER_IP_RATE_LIMIT_ATTEMPTS: ${AUTH_REGISTER_IP_RATE_LIMIT_ATTEMPTS:-5}
      AUTH_REGISTER_IP_RATE_LIMIT_WINDOW: ${AUTH_REGISTER_IP_RATE_LIMIT_WINDOW:-1h}
      AUTH_REGISTER_EMAIL_RATE_LIMIT_ATTEMPTS: ${AUTH_REGISTER_EMAIL_RATE_LIMIT_ATTEMPTS:-3}
      AUTH_REGISTER_EMAIL_RATE_LIMIT_WINDOW: ${AUTH_REGISTER_EMAIL_RATE_LIMIT_WINDOW:-1h}
      AUTH_DISPOSABLE_EMAIL_CHECK: ${AUTH_DISPOSABLE_EMAIL_CHECK:-true}
    # Readiness, not liveness: unhealthy while MongoDB is unreachable. The
    # distroless image has no shell or curl, so the binary probes itself.
    healthcheck:
      test: ["CMD", "/app", "healthcheck", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge
      - internal
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-bootstrap:
        condition: service_completed_successfully
      # service_started, not service_healthy: the API must boot while the
      # broker is down. Publishing is best-effort and never blocks a request.
      rabbitmq:
        condition: service_started

  # ---- Web client -------------------------------------------------------------
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: legnaris-web:local
    environment:
      # The browser-facing API origin, written to /config.json at container
      # start: changing it needs a restart of this service, not a rebuild.
      API_BASE_URL: ${WEB_API_BASE_URL:-https://api-legnaris.paulovalleriote.io}
      # AdSense settings, also written to /config.json at start. An empty client
      # leaves ads off and /ads.txt answers 404; invalid values are omitted.
      ADSENSE_CLIENT: ${ADSENSE_CLIENT:-}
      ADSENSE_SLOT_CATALOG: ${ADSENSE_SLOT_CATALOG:-}
      ADSENSE_SLOT_CAMPAIGNS: ${ADSENSE_SLOT_CAMPAIGNS:-}
      ADSENSE_SLOT_LANDING: ${ADSENSE_SLOT_LANDING:-}
    restart: unless-stopped
    # Only Traefik needs to reach it, so it never joins the internal network the
    # database and the observability stack live on.
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---- Database -------------------------------------------------------------
  # Single-member replica set rs0. The keyfile turns on authorization,
  # so mongod starts with no users; mongodb-bootstrap sets up the set and the
  # users on every start.
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    command: ["--replSet", "rs0", "--keyFile", "/etc/mongo-keyfile/keyfile"]
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/etc/mongo-keyfile:ro
    depends_on:
      mongodb-keyfile:
        condition: service_completed_successfully
    networks:
      - internal
    # Unauthenticated ping: the server answers it before any user exists, so the
    # bootstrap can wait on it.
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot: initiates rs0, creates the root user, then the application users
  # (deploy/mongodb/bootstrap.sh). It shares the member's network namespace, so its
  # connection is a localhost connection, the only way to act before the first
  # user exists. Every service that reads the database waits for it to finish.
  mongodb-bootstrap:
    image: mongo:7.0
    restart: "no"
    network_mode: "service:mongodb"
    command: ["sh", "/provision/bootstrap.sh", "/provision/init/00-replset.js", "/provision/init/01-create-users.js"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_EXPORTER_PASSWORD: ${MONGO_EXPORTER_PASSWORD}
      MONGO_VIEW_PASSWORD: ${MONGO_VIEW_PASSWORD}
      # The address the member is reached at inside the internal network.
      MONGO_RS_MEMBER: mongodb:27017
    volumes:
      - ./mongodb:/provision:ro
    depends_on:
      mongodb:
        condition: service_healthy

  # ---- Rate-limit store -------------------------------------------------------
  # Ephemeral by design: counters live one window, so no volume and no
  # persistence. Internal network only, never published to the host.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---- Message broker ---------------------------------------------------------
  rabbitmq:
    # Derived image: the pinned 4.x release with the Prometheus plugin enabled
    # at build time (BRK-06, BRK-14). The pin lives in rabbitmq/Dockerfile.
    build:
      context: ./rabbitmq
    image: legnaris-rabbitmq:local
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: legnaris
      # Required: the broker must never start with an empty password, and the
      # relay's default RABBITMQ_URL is derived from the same value.
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # The console account's password, read only by the provisioning that runs
      # beside the broker. Empty leaves the account as it is (BRK-10, BRK-11).
      RABBITMQ_OPS_PASSWORD: ${RABBITMQ_OPS_PASSWORD:-}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-legnaris.conf:ro
    # The broker is reachable only on the internal network: it declares no
    # published host port, for the console and the metrics alike. The console
    # is served through Traefik (which also sits on the internal network), the
    # relay and the worker connect directly (EML-16, BRK-05, BRK-07, BRK-12).
    networks:
      - internal
    # Healthy means the broker answers and the provisioning has given the
    # application's account its rights on the delivery vhost, so the relay and
    # the worker never start against an unprovisioned broker (BRK-09).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          rabbitmq-diagnostics -q ping &&
          rabbitmqctl -q --no-table-headers list_permissions -p legnaris | cut -f1 | grep -qx legnaris
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ---- Email relay (publication process) --------------------------------------
  relay:
    build:
      context: ..
      dockerfile: Dockerfile
    image: legnaris-app:local
    restart: unless-stopped
    # The shared image carries /relay beside /app; the relay is a separate
    # process with its own lifecycle (O2, EML-16).
    entrypoint: ["/relay"]
    environment:
      DATABASE_URI: mongodb://legnaris_app:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}@mongodb:27017/legnaris?replicaSet=rs0&retryWrites=true&authSource=legnaris
      DATABASE_NAME: legnaris
      DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-20}
      DATABASE_MIN_POOL_SIZE: ${DATABASE_MIN_POOL_SIZE:-0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://legnaris:${RABBITMQ_PASSWORD}@rabbitmq:5672/legnaris}
      # Optional billing settings (LGN-211). Empty keeps billing unconfigured.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_USD: ${STRIPE_PRICE_ID_USD:-}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-}
      EMAIL_RELAY_POLL_INTERVAL: ${EMAIL_RELAY_POLL_INTERVAL:-1s}
      EMAIL_RELAY_LEASE: ${EMAIL_RELAY_LEASE:-30s}
      EMAIL_RELAY_BATCH: ${EMAIL_RELAY_BATCH:-25}
      EMAIL_RELAY_CONFIRM_TIMEOUT: ${EMAIL_RELAY_CONFIRM_TIMEOUT:-5s}
      EMAIL_RELAY_MAX_ATTEMPTS: ${EMAIL_RELAY_MAX_ATTEMPTS:-5}
      EMAIL_OUTBOX_RETENTION: ${EMAIL_OUTBOX_RETENTION:-168h}
      EMAIL_RELAY_METRICS_ADDR: ${EMAIL_RELAY_METRICS_ADDR:-:9100}
    # Only the relay depends on the broker; the app never does (EML-16).
    networks:
      - internal
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # ---- Email worker (delivery process) ---------------------------------------
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: legnaris-app:local
    restart: unless-stopped
    # The shared image carries /worker beside /app and /relay. Nothing depends
    # on the worker: a broker or provider outage delays codes and generations
    # and never reaches the site (O2, BRK-01, BRK-03, BRK-20). Email delivery
    # needs no database; the generation consumer (LGN-230) opens Mongo only
    # when GENERATION_ENABLED is true.
    entrypoint: ["/worker"]
    environment:
      # The same delivery vhost as the relay; the broker provisions it on start
      # (README, "RabbitMQ provisioning").
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://legnaris:${RABBITMQ_PASSWORD}@rabbitmq:5672/legnaris}
      # Generation jobs write the result to Mongo and call the LLM gateway.
      # LLM_API_KEY is the OpenRouter key; it reaches only this process. No
      # depends_on for Mongo: e-mail delivery must keep running when the store
      # is down, and the consumer reconnects on its own.
      DATABASE_URI: mongodb://legnaris_app:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}@mongodb:27017/legnaris?replicaSet=rs0&retryWrites=true&authSource=legnaris
      DATABASE_NAME: legnaris
      DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-20}
      DATABASE_MIN_POOL_SIZE: ${DATABASE_MIN_POOL_SIZE:-0}
      GENERATION_ENABLED: ${GENERATION_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-z-ai/glm-5.3-flash}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120s}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      # Production: the worker refuses the dev sender (EMAIL_PROVIDER=dev) when
      # APP_ENV is production, so a code can never reach the logs (D10).
      APP_ENV: production
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_SEND_TIMEOUT: ${EMAIL_SEND_TIMEOUT:-10s}
      EMAIL_WORKER_PREFETCH: ${EMAIL_WORKER_PREFETCH:-10}
      EMAIL_WORKER_MAX_ATTEMPTS: ${EMAIL_WORKER_MAX_ATTEMPTS:-5}
      EMAIL_WORKER_METRICS_ADDR: ${EMAIL_WORKER_METRICS_ADDR:-:9101}
    networks:
      - internal
    depends_on:
      rabbitmq:
        condition: service_healthy

  # One-shot: writes the replica-set keyfile on first run, before mongod starts.
  mongodb-keyfile:
    image: mongo:7.0
    restart: "no"
    entrypoint: ["sh", "/provision/keyfile.sh", "/etc/mongo-keyfile"]
    volumes:
      - ./mongodb/keyfile.sh:/provision/keyfile.sh:ro
      - mongo_keyfile:/etc/mongo-keyfile
    networks:
      - internal

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    restart: unless-stopped
    command:
      - --mongodb.uri=mongodb://legnaris_exporter:${MONGO_EXPORTER_PASSWORD}@mongodb:27017/admin?replicaSet=rs0&retryWrites=true&authSource=admin
    networks:
      - internal
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-bootstrap:
        condition: service_completed_successfully

  # ---- Observability ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Bound the TSDB so prometheus_data does not grow without limit.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=20GB
      - --web.external-url=https://${OPS_DOMAIN}/prometheus
      - --web.route-prefix=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./prometheus/rules-f1a.yml:/etc/prometheus/rules-f1a.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - internal

  alloy:
    image: grafana/alloy:v1.17.1
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    networks:
      - internal
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${OPS_DOMAIN}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - internal
    depends_on:
      - prometheus
      - loki

  # ---- Database UI ------------------------------------------------------------
  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://legnaris_view:${MONGO_VIEW_PASSWORD}@mongodb:27017/legnaris?replicaSet=rs0&retryWrites=true&authSource=legnaris
      ME_CONFIG_SITE_BASEURL: /mongo
      # legnaris_view only reads `legnaris`; admin mode runs serverStatus and
      # lists every database, which that account may not do.
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "false"
      # Edge OAuth is the primary gate; basic auth adds defense in depth.
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    networks:
      - internal
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-bootstrap:
        condition: service_completed_successfully
