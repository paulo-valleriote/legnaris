# =============================================================================
# Legnaris — production stack (single VPS, docker-compose)
# =============================================================================
# NOTE: the project name is deliberately "legnaris-prod" (not "legnaris") so its
# volumes/networks never collide with the dev stack in the repo-root
# docker-compose.yml (which defaults to the "legnaris" project).
# Usage:
#   cp .env.example .env     # then fill every replace_me value
#   docker compose up -d --build
#
# Domains:
#   api.legnaris.com.br  -> app (public API, no auth)
#   ops.legnaris.com.br  -> Grafana/Prometheus/Mongo Express (GitHub OAuth)
#     /grafana, /prometheus, /mongo, /oauth2/callback
#
# Local development (via Cloudflare Tunnel):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# =============================================================================

name: legnaris-prod

networks:
  edge:
  internal:

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:
  loki_data:
  letsencrypt:

services:
  # ---- Edge router + TLS ----------------------------------------------------
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
    environment:
      API_DOMAIN: ${API_DOMAIN}
      OPS_DOMAIN: ${OPS_DOMAIN}
      TRAEFIK_ENTRYPOINT: websecure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    networks:
      - edge
      - internal
    depends_on:
      - oauth2-proxy

  # ---- GitHub OAuth gate ----------------------------------------------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.0
    restart: unless-stopped
    command:
      - --provider=github
      - --email-domain=*
      - --github-user=${GITHUB_USER}
      - --client-id=${GITHUB_CLIENT_ID}
      - --client-secret=${GITHUB_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --cookie-secure=true
      - --cookie-expire=24h
      - --upstream=static://202
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --redirect-url=https://${OPS_DOMAIN}/oauth2/callback
      - --whitelist-domain=${OPS_DOMAIN}
      - --scope=user:email read:org
    networks:
      - edge

  # ---- Application ----------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: legnaris-app:local
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_NAME: legnaris
      DATABASE_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    networks:
      - edge
      - internal
    depends_on:
      mongodb:
        condition: service_healthy

  # ---- Database -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet -u root -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'db.adminCommand("ping").ok' | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    restart: unless-stopped
    command:
      - --mongodb.uri=mongodb://root:${MONGO_ROOT_PASSWORD}@mongodb:27017/admin
    networks:
      - internal
    depends_on:
      mongodb:
        condition: service_healthy

  # ---- Observability ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.external-url=https://${OPS_DOMAIN}/prometheus
      - --web.route-prefix=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - edge
      - internal

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - internal

  alloy:
    # Pin to a specific tag (e.g. v1.x) once you have validated the stack.
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    networks:
      - internal
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${OPS_DOMAIN}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - edge
      - internal
    depends_on:
      - prometheus
      - loki

  # ---- Database UI ------------------------------------------------------------
  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_SITE_BASEURL: /mongo
      # Auth is delegated to oauth2-proxy at the edge; enable ME_CONFIG_BASICAUTH
      # as an extra layer if you prefer defense in depth.
      ME_CONFIG_BASICAUTH: "false"
    networks:
      - edge
      - internal
    depends_on:
      mongodb:
        condition: service_healthy
