# Daily MongoDB dump shipped to an S3-compatible bucket. Retention is a bucket
# lifecycle rule (see deploy/k8s/production/RUNBOOK.md); the credentials come
# from the sealed `backup-s3` secret (keys: S3_ENDPOINT, S3_BUCKET,
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: dump
              image: mongo:7.0
              command:
                - sh
                - -c
                - >-
                  set -eu;
                  mongodump --uri="mongodb://root:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin"
                  --db=legnaris --archive=/backup/legnaris.archive.gz --gzip
              env:
                - name: MONGO_ROOT_PASSWORD
                  valueFrom: {secretKeyRef: {name: legnaris-secrets, key: MONGO_ROOT_PASSWORD}}
              volumeMounts:
                - {name: backup, mountPath: /backup}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
          containers:
            - name: upload
              image: amazon/aws-cli:2.17.0
              command:
                - sh
                - -c
                - >-
                  set -eu;
                  aws s3 cp /backup/legnaris.archive.gz
                  "s3://${S3_BUCKET}/mongodb/legnaris-$(date -u +%Y%m%dT%H%M%SZ).archive.gz"
                  --endpoint-url "${S3_ENDPOINT}"
              envFrom:
                - secretRef: {name: backup-s3}
              volumeMounts:
                - {name: backup, mountPath: /backup}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 256Mi}
          volumes:
            - name: backup
              emptyDir: {}
