apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Disposable-cluster only: lifts the rate limits (they would refuse the load)
# and adds the k6 Job. Never apply this overlay to a shared environment.
resources:
  - ../local
  - k6-job.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: k6-scripts
    files:
      - ../../../../loadtest/k6/capacity.js
      - ../../../../loadtest/k6/auth-storm.js
      - ../../../../loadtest/k6/patch-sheet.js
      - ../../../../loadtest/k6/soak.js
      - ../../../../loadtest/k6/stress.js
      - ../../../../loadtest/k6/concurrency.js
      - ../../../../loadtest/k6/onboarding.js
      - ../../../../loadtest/k6/seed.js
  - name: k6-lib
    files:
      - ../../../../loadtest/k6/lib/accounts.js
      - ../../../../loadtest/k6/lib/mix.js
      - ../../../../loadtest/k6/lib/ramp.js
  - name: app-config
    behavior: merge
    literals:
      - AUTH_RATE_LIMIT_ATTEMPTS=100000
      - USER_RATE_LIMIT_ATTEMPTS=1000000
      - PUBLIC_RATE_LIMIT_ATTEMPTS=1000000
      - AUTH_REGISTER_IP_RATE_LIMIT_ATTEMPTS=100000
      - AUTH_REGISTER_EMAIL_RATE_LIMIT_ATTEMPTS=100000
      - AUTH_DISPOSABLE_EMAIL_CHECK=false
