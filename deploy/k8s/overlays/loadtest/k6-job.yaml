# Results are pushed to Prometheus (remote-write receiver, LGN-133) so the
# loadtest dashboard shows replicas x CPU x p95 together. Pick the script with
# `make k8s-loadtest SCRIPT=capacity.js`.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.57.0
          args: ["run", "--out", "experimental-prometheus-rw", "/scripts/capacity.js"]
          env:
            - {name: BASE_URL, value: "http://app:8080"}
            - {name: K6_PROMETHEUS_RW_SERVER_URL, value: "http://kps-kube-prometheus-stack-prometheus.monitoring:9090/api/v1/write"}
            - {name: K6_PROMETHEUS_RW_TREND_STATS, value: "p(95),p(99),avg,max"}
            - {name: K6_PROMETHEUS_RW_PUSH_INTERVAL, value: "5s"}
            - {name: USERS, value: "200"}
            - {name: STAGES, value: "50,100,200,400,800"}
            - {name: STEP_SECONDS, value: "120"}
            - {name: P95_BUDGET_MS, value: "200"}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: lib, mountPath: /scripts/lib, readOnly: true}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: scripts
          configMap: {name: k6-scripts}
        - name: lib
          configMap: {name: k6-lib}
