# /oauth2 is the proxy's own callback and must not sit behind the gate it serves.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-oauth2
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts: [ops.legnaris.com.br]
      secretName: ops-tls
  rules:
    - host: ops.legnaris.com.br
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend: {service: {name: oauth2-proxy, port: {name: http}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-grafana
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-oauth@kubernetescrd,default-security-headers@kubernetescrd
spec:
  tls:
    - hosts: [ops.legnaris.com.br]
      secretName: ops-tls
  rules:
    - host: ops.legnaris.com.br
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend: {service: {name: kps-grafana, port: {number: 80}}}
