# Same gate as compose (deploy/docker-compose.yml, `oauth2-proxy`), as a Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels: {app: oauth2-proxy}
  template:
    metadata:
      labels: {app: oauth2-proxy}
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.0
          args: ["--email-domain=*"]
          ports:
            - {name: http, containerPort: 4180}
          envFrom:
            - secretRef: {name: oauth2-proxy}
          env:
            - {name: OAUTH2_PROXY_PROVIDER, value: github}
            - {name: OAUTH2_PROXY_COOKIE_SECURE, value: "true"}
            - {name: OAUTH2_PROXY_COOKIE_EXPIRE, value: 24h}
            - {name: OAUTH2_PROXY_UPSTREAMS, value: "static://202"}
            - {name: OAUTH2_PROXY_HTTP_ADDRESS, value: "0.0.0.0:4180"}
            - {name: OAUTH2_PROXY_REVERSE_PROXY, value: "true"}
            - {name: OAUTH2_PROXY_SET_XAUTHREQUEST, value: "true"}
            - {name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON, value: "true"}
            - {name: OAUTH2_PROXY_REDIRECT_URL, value: "https://ops.legnaris.com.br/oauth2/callback"}
            - {name: OAUTH2_PROXY_WHITELIST_DOMAIN, value: ops.legnaris.com.br}
            - {name: OAUTH2_PROXY_SCOPE, value: "user:email,read:org"}
          readinessProbe:
            httpGet: {path: /ping, port: http}
          livenessProbe:
            httpGet: {path: /ping, port: http}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
spec:
  selector: {app: oauth2-proxy}
  ports:
    - {name: http, port: 4180, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth
spec:
  forwardAuth:
    address: http://oauth2-proxy.monitoring:4180
    trustForwardHeader: true
    authResponseHeaders: [X-Auth-Request-User, X-Auth-Request-Email]
