apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Images are built locally and imported into the cluster (`make k8s-up`); no
# registry is involved. Swap for ghcr.io/...:sha-<commit> to run CI images.
images:
  - name: legnaris-app
    newName: legnaris-app
    newTag: local
  - name: legnaris-web
    newName: legnaris-web
    newTag: local
  - name: legnaris-rabbitmq
    newName: legnaris-rabbitmq
    newTag: local

configMapGenerator:
  - name: env-config
    literals:
      - API_BASE_URL=http://api.legnaris.localhost:8080
      - CORS_ALLOWED_ORIGINS=http://app.legnaris.localhost:8080

# secrets.env is generated by `make k8s-up` (gitignored); see secrets.env.example.
secretGenerator:
  - name: legnaris-secrets
    envs:
      - secrets.env

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target: {kind: Ingress, name: legnaris}
    patch: |-
      - {op: replace, path: /spec/rules/0/host, value: api.legnaris.localhost}
      - {op: replace, path: /spec/rules/1/host, value: app.legnaris.localhost}
