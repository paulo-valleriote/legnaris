apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applied after the kube-prometheus-stack chart (it installs the CRDs these
# objects need); `make k8s-observability` does both.
resources:
  - podmonitors.yaml
  - prometheusrule.yaml

# Grafana's sidecar imports every ConfigMap carrying the grafana_dashboard label.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: dashboard-legnaris-api
    files: [legnaris-api.json=../../grafana/dashboards/legnaris-api.json]
  - name: dashboard-email-pipeline
    files: [email-pipeline.json=../../grafana/dashboards/email-pipeline.json]
  - name: dashboard-legnaris-loadtest
    files: [legnaris-loadtest.json=../../grafana/dashboards/legnaris-loadtest.json]
