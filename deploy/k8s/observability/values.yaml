# kube-prometheus-stack values for the local k3d cluster (LGN-133).
# Chart version is pinned in the Makefile (K8S_PROM_CHART_VERSION).

prometheus:
  prometheusSpec:
    # Pick up PodMonitors, rules and dashboards from any namespace/release,
    # not only those labelled with this Helm release.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # k6 pushes its results here (loadtest dashboard).
    enableRemoteWriteReceiver: true
    retention: 2d
    resources:
      requests: {cpu: 100m, memory: 400Mi}
      limits: {memory: 800Mi}

grafana:
  adminPassword: admin   # local, throwaway cluster only; port-forward access
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      # Existing dashboards reference the datasource by uid `prometheus`.
      uid: prometheus

# Not scraped by default on k3s (control-plane components bind locally); keep
# the local footprint small.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
alertmanager:
  enabled: false
