# Layered over values.yaml for production: `-f values.yaml -f values-production.yaml`.
prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: 15GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 20Gi}
    resources:
      requests: {cpu: 200m, memory: 800Mi}
      limits: {memory: 1500Mi}

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: https://ops-legnaris.paulovalleriote.io/grafana
      serve_from_sub_path: true
  persistence:
    enabled: true
    size: 2Gi
