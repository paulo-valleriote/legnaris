# GENERATED from deploy/prometheus/rules.yml - edit that file, then run
# `make k8s-rules`. TestK8sPrometheusRuleMatchesRulesFile fails on drift.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: legnaris-email-pipeline
spec:
  groups:
  - name: legnaris-email-pipeline-thresholds
    rules:
    - record: legnaris:email_pipeline:threshold_backlog_pending
      expr: vector(100)
    - record: legnaris:email_pipeline:threshold_verification_failures
      expr: vector(30)
    - record: legnaris:email_pipeline:threshold_register_429s
      expr: vector(30)
    - record: legnaris:email_pipeline:threshold_early_cap_days
      expr: vector(2)
  - name: legnaris-email-pipeline-alerts
    rules:
    - alert: EmailDeadLetterQueueHoldsMessages
      expr: rabbitmq_queue_messages_ready{job="legnaris-rabbitmq", vhost="legnaris", queue="email.dead"} > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: The dead-letter queue is holding a message
        description: email.dead holds {{ $value }} message(s) that were abandoned; each is a code that never reached its owner.
        runbook: deploy/README.md#emaildeadletterqueueholdsmessages
    - alert: EmailWorkQueueHasNoConsumer
      expr: rabbitmq_queue_consumers{job="legnaris-rabbitmq", vhost="legnaris", queue="email.otp"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: Nobody is consuming the work queue
        description: email.otp has no consumer, so no code is being delivered at all.
        runbook: deploy/README.md#emailworkqueuehasnoconsumer
    - alert: EmailOldestMessageTooOld
      expr: |
        min_over_time(rabbitmq_queue_messages_ready{job="legnaris-rabbitmq", vhost="legnaris", queue="email.otp"}[1m]) > 0
        and on(vhost, queue)
        (rabbitmq_queue_consumers{job="legnaris-rabbitmq", vhost="legnaris", queue="email.otp"} > 0)
      for: 2m
      labels:
        severity: high
      annotations:
        summary: The work queue has not drained, so its oldest message has waited too long
        description: email.otp has had ready messages for the whole of the last three minutes although a consumer is attached; codes are waiting and may expire.
        runbook: deploy/README.md#emailoldestmessagetooold
    - alert: EmailPublicationBacklogTooLarge
      expr: legnaris_email_outbox_backlog{job="legnaris-relay"} > on() group_left() legnaris:email_pipeline:threshold_backlog_pending
      for: 5m
      labels:
        severity: high
      annotations:
        summary: The backlog of unpublished codes is too large
        description: '{{ $value }} codes are waiting in the outbox to be published to the broker.'
        runbook: deploy/README.md#emailpublicationbacklogtoolarge
    - alert: EmailPublicationFailing
      expr: sum(increase(legnaris_email_publish_total{job="legnaris-relay", result=~"retried|failed"}[5m])) > 0
      for: 5m
      labels:
        severity: high
      annotations:
        summary: The publication to the broker keeps failing
        description: The relay has failed or retried publications within every five-minute window for five minutes; codes are not reaching the broker.
        runbook: deploy/README.md#emailpublicationfailing
    - alert: EmailProviderRefusingSends
      expr: sum(increase(legnaris_email_send_total{job="legnaris-worker", result="retried"}[5m])) > 0
      for: 5m
      labels:
        severity: high
      annotations:
        summary: The email provider is refusing sends
        description: The worker has retried sends within every five-minute window for five minutes; the provider is rate-limiting, failing or unreachable.
        runbook: deploy/README.md#emailproviderrefusingsends
    - alert: EmailDailyAllowanceReached
      expr: increase(legnaris_auth_otp_cap_blocked_total{job="legnaris-app"}[15m]) > 0
      for: 5m
      labels:
        severity: medium
      annotations:
        summary: The daily email allowance has been reached
        description: The site is refusing code requests because the daily send cap is spent; the pipeline works and the ceiling is what stops it.
        runbook: deploy/README.md#emaildailyallowancereached
    - alert: EmailVerificationFailuresClimbing
      expr: sum(increase(legnaris_auth_otp_verify_total{job="legnaris-app", result!="verified"}[10m])) > on() group_left() legnaris:email_pipeline:threshold_verification_failures
      for: 5m
      labels:
        severity: medium
      annotations:
        summary: Code verification failures are climbing
        description: '{{ $value }} codes were refused in ten minutes; either delivery is broken or somebody is guessing codes.'
        runbook: deploy/README.md#emailverificationfailuresclimbing
    - alert: EmailPipelineSeriesMissing
      expr: |
        absent(rabbitmq_queue_consumers{job="legnaris-rabbitmq", vhost="legnaris", queue="email.otp"})
        or absent(legnaris_email_outbox_backlog{job="legnaris-relay"})
        or absent(legnaris_email_dead_total{job="legnaris-worker"})
        or (up{job="legnaris-app"} == 0)
      for: 5m
      labels:
        severity: high
      annotations:
        summary: A series the pipeline alerts read has stopped arriving
        description: The broker, the relay or the worker is not being scraped, so the alerts that read its series cannot fire; the pipeline is unwatched.
        runbook: deploy/README.md#emailpipelineseriesmissing
    - alert: EmailRegisterBurstTooLarge
      expr: sum(increase(legnaris_http_requests_total{job="legnaris-app", method="POST", path="/auth/register", status="429"}[24h])) > on() group_left() legnaris:email_pipeline:threshold_register_429s
      for: 5m
      labels:
        severity: medium
      annotations:
        summary: The register route is refusing an unusual number of requests
        description: '{{ $value }} register requests were refused with 429 in the last 24 hours; registration is being hammered and the captcha decision is due.'
        runbook: deploy/README.md#emailregisterbursttoolarge
    - alert: EmailCapReachedEarly
      expr: count_over_time((sum(increase(legnaris_auth_otp_cap_blocked_total{job="legnaris-app"}[12h])) > 0)[7d:1d] offset 12h) >= on() group_left() legnaris:email_pipeline:threshold_early_cap_days
      for: 15m
      labels:
        severity: medium
      annotations:
        summary: The daily send cap runs out before noon UTC on several days
        description: The daily send cap was spent before 12:00 UTC on {{ $value }} day(s) this week; legitimate sign-ups are being starved, and the captcha decision is due.
        runbook: deploy/README.md#emailcapreachedearly
