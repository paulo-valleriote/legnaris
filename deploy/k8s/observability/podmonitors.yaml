# One PodMonitor per workload: a Service-level scrape would hit a single replica
# (the Service load-balances), while a PodMonitor makes every replica a target.
# `job` is rewritten to the names the compose stack used so that
# prometheus/rules.yml and the Grafana dashboards work unchanged.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: legnaris-app
spec:
  namespaceSelector:
    matchNames: [default]
  selector:
    matchLabels: {app: app}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      relabelings:
        - {action: replace, targetLabel: job, replacement: legnaris-app}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: legnaris-relay
spec:
  namespaceSelector:
    matchNames: [default]
  selector:
    matchLabels: {app: relay}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      relabelings:
        - {action: replace, targetLabel: job, replacement: legnaris-relay}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: legnaris-worker
spec:
  namespaceSelector:
    matchNames: [default]
  selector:
    matchLabels: {app: worker}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      relabelings:
        - {action: replace, targetLabel: job, replacement: legnaris-worker}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: legnaris-rabbitmq
spec:
  namespaceSelector:
    matchNames: [default]
  selector:
    matchLabels: {app: rabbitmq}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      relabelings:
        - {action: replace, targetLabel: job, replacement: legnaris-rabbitmq}
