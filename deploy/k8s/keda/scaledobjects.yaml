# Event-driven scaling of the email pipeline from Prometheus series.
#
# minReplicaCount is 1, not 0, on purpose: the EmailWorkQueueHasNoConsumer
# alert fires when email.otp has no consumer for 2 minutes. Scaling the worker
# to zero on an empty queue would trip it permanently, so scale-to-zero needs
# that rule changed first (condition it on messages_ready > 0) and is left off.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 1
  maxReplicaCount: 6
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kps-kube-prometheus-stack-prometheus.monitoring:9090
        query: sum(rabbitmq_queue_messages_ready{job="legnaris-rabbitmq", vhost="legnaris", queue="email.otp"})
        threshold: "20"
        ignoreNullValues: "true"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: relay
spec:
  scaleTargetRef:
    name: relay
  minReplicaCount: 1
  maxReplicaCount: 4
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kps-kube-prometheus-stack-prometheus.monitoring:9090
        # Every relay replica reports the same outbox backlog, so take the max
        # rather than a sum that would grow with the replica count.
        query: max(legnaris_email_outbox_backlog{job="legnaris-relay"})
        threshold: "100"
        ignoreNullValues: "true"
