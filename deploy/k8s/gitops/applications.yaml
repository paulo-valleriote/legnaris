# Git is the source of truth: a merge to main reaches the cluster, manual drift
# is reverted (selfHeal) and removed manifests are pruned. Rollback is
# `git revert`. Apply once: `make k8s-gitops`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: legnaris
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paulo-valleriote/legnaris.git
    targetRevision: main
    path: deploy/k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: legnaris-ops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paulo-valleriote/legnaris.git
    targetRevision: main
    path: deploy/k8s/overlays/production-ops
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
