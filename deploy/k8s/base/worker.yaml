apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: legnaris-app
          command: ["/worker"]
          ports:
            - name: metrics
              containerPort: 9101
          env:
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: legnaris-secrets, key: RABBITMQ_PASSWORD}}
            - name: RABBITMQ_URL
              value: amqp://legnaris:$(RABBITMQ_PASSWORD)@rabbitmq:5672/legnaris
            - name: EMAIL_PROVIDER
              value: log
            - name: EMAIL_WORKER_METRICS_ADDR
              value: ":9101"
          livenessProbe:
            tcpSocket: {port: metrics}
            periodSeconds: 10
          readinessProbe:
            tcpSocket: {port: metrics}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
