apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
spec:
  replicas: 2
  selector:
    matchLabels: {app: relay}
  template:
    metadata:
      labels: {app: relay}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: relay
          image: legnaris-app
          # The shared image carries /relay beside /app.
          command: ["/relay"]
          ports:
            - name: metrics
              containerPort: 9100
          env:
            - name: MONGO_APP_PASSWORD
              valueFrom: {secretKeyRef: {name: legnaris-secrets, key: MONGO_APP_PASSWORD}}
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: legnaris-secrets, key: RABBITMQ_PASSWORD}}
            - name: DATABASE_URI
              value: mongodb://legnaris_app:$(MONGO_APP_PASSWORD)@mongodb:27017/legnaris
            - name: DATABASE_NAME
              value: legnaris
            - name: RABBITMQ_URL
              value: amqp://legnaris:$(RABBITMQ_PASSWORD)@rabbitmq:5672/legnaris
            - name: EMAIL_RELAY_METRICS_ADDR
              value: ":9100"
          livenessProbe:
            tcpSocket: {port: metrics}
            periodSeconds: 10
          readinessProbe:
            tcpSocket: {port: metrics}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
