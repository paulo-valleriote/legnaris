# CPU-based autoscaling of the API. It scales on utilisation of requests.cpu,
# so that request must reflect measured capacity (calibrate with the k6
# capacity run, `make k8s-loadtest`); until then 100m is a starting guess.
# metrics-server ships with k3s. A custom metric (legnaris_http_in_flight_requests
# or RPS) needs prometheus-adapter and is left for after the CPU result is known.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Percent, value: 100, periodSeconds: 30}
    scaleDown:
      # Short on purpose for the local cluster so a test shows the descent;
      # production should keep the 300 s default or more.
      stabilizationWindowSeconds: 120
      policies:
        - {type: Pods, value: 1, periodSeconds: 60}
