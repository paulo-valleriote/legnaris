apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: {app: mongodb}
  template:
    metadata:
      labels: {app: mongodb}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: legnaris-secrets, key: MONGO_ROOT_PASSWORD}}
            - name: MONGO_APP_PASSWORD
              valueFrom: {secretKeyRef: {name: legnaris-secrets, key: MONGO_APP_PASSWORD}}
            - name: MONGO_EXPORTER_PASSWORD
              valueFrom: {secretKeyRef: {name: legnaris-secrets, key: MONGO_EXPORTER_PASSWORD}}
            - name: MONGO_VIEW_PASSWORD
              valueFrom: {secretKeyRef: {name: legnaris-secrets, key: MONGO_VIEW_PASSWORD}}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh --quiet -u root -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'db.adminCommand("ping").ok' | grep -q 1
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh --quiet -u root -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'db.adminCommand("ping").ok' | grep -q 1
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: init
          configMap: {name: mongodb-init}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  clusterIP: None
  selector: {app: mongodb}
  ports:
    - name: mongo
      port: 27017
