apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  PORT: "8080"
  APP_NAME: legnaris
  SHUTDOWN_TIMEOUT: 5s
  DATABASE_NAME: legnaris
  DATABASE_MAX_POOL_SIZE: "20"
  DATABASE_MIN_POOL_SIZE: "0"
  REDIS_URL: redis://redis:6379/0
  EMAIL_PROVIDER: log
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2
  # Zero unavailable plus one surge keeps a ready pod serving through every
  # rollout; the readiness probe gates each step.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      # preStop delay + SHUTDOWN_TIMEOUT + DATABASE_CLOSE_TIMEOUT (5s each) must
      # fit inside this, or the kubelet SIGKILLs the app mid-drain.
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: legnaris-app
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - name: MONGO_APP_PASSWORD
              valueFrom: {secretKeyRef: {name: legnaris-secrets, key: MONGO_APP_PASSWORD}}
            - name: DATABASE_URI
              value: mongodb://legnaris_app:$(MONGO_APP_PASSWORD)@mongodb:27017/legnaris
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: legnaris-secrets, key: JWT_SECRET}}
            - name: EMAIL_CODE_SECRET
              valueFrom: {secretKeyRef: {name: legnaris-secrets, key: EMAIL_CODE_SECRET}}
            - name: CORS_ALLOWED_ORIGINS
              valueFrom: {configMapKeyRef: {name: env-config, key: CORS_ALLOWED_ORIGINS}}
          # The endpoints stop receiving traffic before SIGTERM reaches the app,
          # so in-flight requests routed just before removal still complete.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector: {app: app}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: app}
