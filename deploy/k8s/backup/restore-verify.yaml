# Manual: proves the latest backup restores. It restores into a scratch database
# (legnaris_restore_check), fails if it is empty, then drops it. Production data
# is never touched. Run: kubectl apply -f deploy/k8s/backup/restore-verify.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-restore-verify
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: fetch-latest
          image: amazon/aws-cli:2.17.0
          command:
            - sh
            - -c
            - >-
              set -eu;
              latest=$(aws s3 ls "s3://${S3_BUCKET}/mongodb/" --endpoint-url "${S3_ENDPOINT}" | sort | tail -n 1 | awk '{print $4}');
              test -n "$latest";
              echo "restoring $latest";
              aws s3 cp "s3://${S3_BUCKET}/mongodb/$latest" /backup/latest.archive.gz --endpoint-url "${S3_ENDPOINT}"
          envFrom:
            - secretRef: {name: backup-s3}
          volumeMounts:
            - {name: backup, mountPath: /backup}
      containers:
        - name: restore
          image: mongo:7.0
          command:
            - sh
            - -c
            - >-
              set -eu;
              uri="mongodb://root:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin";
              mongorestore --uri="$uri" --archive=/backup/latest.archive.gz --gzip
              --nsFrom='legnaris.*' --nsTo='legnaris_restore_check.*';
              count=$(mongosh "$uri" --quiet --eval 'db.getSiblingDB("legnaris_restore_check").getCollectionNames().length');
              echo "collections restored: $count";
              mongosh "$uri" --quiet --eval 'db.getSiblingDB("legnaris_restore_check").dropDatabase()';
              test "$count" -gt 0
          env:
            - name: MONGO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: legnaris-secrets, key: MONGO_ROOT_PASSWORD}}
          volumeMounts:
            - {name: backup, mountPath: /backup}
      volumes:
        - name: backup
          emptyDir: {}
