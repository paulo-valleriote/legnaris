global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: legnaris-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8080

  - job_name: legnaris-relay
    metrics_path: /metrics
    static_configs:
      - targets:
          - relay:9100

  - job_name: legnaris-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9101

  - job_name: legnaris-rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbitmq:15692

  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets:
          - traefik:8082

  - job_name: mongodb
    metrics_path: /metrics
    static_configs:
      - targets:
          - mongodb-exporter:9216
