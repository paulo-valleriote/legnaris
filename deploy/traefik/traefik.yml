# Static Traefik config for the LOCAL stack only (docker-compose.local.yml, plain
# HTTP behind Cloudflare Tunnel). Production configures Traefik entirely by CLI
# flags in docker-compose.yml, because Traefik ignores CLI flags whenever a
# config file is given. Keep the non-TLS settings here in sync with those flags.

global:
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
  # Internal-only entrypoint (not published) so Prometheus can scrape Traefik
  # metrics over plain HTTP without going through the public entrypoints.
  metrics:
    address: ":8082"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true

log:
  level: INFO
  format: json

accessLog:
  format: json
