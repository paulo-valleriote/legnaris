# Dynamic routing (file provider). Values are resolved from the Traefik
# container environment at runtime:
#   {{ env "API_DOMAIN" }}        public API hostname
#   {{ env "WEB_DOMAIN" }}        public web client hostname
#   {{ env "OPS_DOMAIN" }}        observability + OAuth hostname
#   {{ env "TRAEFIK_ENTRYPOINT" }}  "websecure" (prod) or "web" (local tunnel)

http:
  middlewares:
    oauth:
      forwardAuth:
        address: "http://oauth2-proxy:4180"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Auth-Request-User"
          - "X-Auth-Request-Email"

    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"

    # Document security headers for the web client origin only (POL-02 / F9-T005).
    # Dedicated instead of widening `security-headers` so the ops routers
    # (Grafana, Prometheus, Mongo Express) keep their own policy and a CSP
    # change here can never break the observability stack.
    web-security-headers:
      headers:
        # Enforce (not Report-Only): the policy is delivered with every document
        # and a violation is reported to the collector (csp-enforce.contract.md).
        contentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.legnaris.com.br; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; report-to csp-endpoint; report-uri https://api.legnaris.com.br/csp-report"
        customResponseHeaders:
          Reporting-Endpoints: 'csp-endpoint="https://api.legnaris.com.br/csp-report"'
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)"
        crossOriginOpenerPolicy: "same-origin"
        crossOriginResourcePolicy: "same-origin"

  services:
    app:
      loadBalancer:
        servers:
          - url: "http://app:8080"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    web:
      loadBalancer:
        servers:
          - url: "http://web:80"

    prometheus:
      loadBalancer:
        servers:
          - url: "http://prometheus:9090"

    mongo-express:
      loadBalancer:
        servers:
          - url: "http://mongo-express:8081"

    oauth2-proxy:
      loadBalancer:
        servers:
          - url: "http://oauth2-proxy:4180"

  routers:
    # OAuth callback on the ops domain (no oauth middleware, else login loops).
    oauth2-proxy:
      rule: 'Host(`{{ env "OPS_DOMAIN" }}`) && PathPrefix(`/oauth2`)'
      entryPoints: ['{{ env "TRAEFIK_ENTRYPOINT" }}']
      service: oauth2-proxy

    grafana:
      rule: 'Host(`{{ env "OPS_DOMAIN" }}`) && PathPrefix(`/grafana`)'
      entryPoints: ['{{ env "TRAEFIK_ENTRYPOINT" }}']
      service: grafana
      middlewares: ["oauth", "security-headers"]

    prometheus:
      rule: 'Host(`{{ env "OPS_DOMAIN" }}`) && PathPrefix(`/prometheus`)'
      entryPoints: ['{{ env "TRAEFIK_ENTRYPOINT" }}']
      service: prometheus
      middlewares: ["oauth", "security-headers"]

    mongo-express:
      rule: 'Host(`{{ env "OPS_DOMAIN" }}`) && PathPrefix(`/mongo`)'
      entryPoints: ['{{ env "TRAEFIK_ENTRYPOINT" }}']
      service: mongo-express
      middlewares: ["oauth", "security-headers"]

    # Redirect root of ops domain to /grafana
    ops-home:
      rule: 'Host(`{{ env "OPS_DOMAIN" }}`) && PathPrefix(`/`)'
      entryPoints: ['{{ env "TRAEFIK_ENTRYPOINT" }}']
      service: grafana
      middlewares: ["oauth", "security-headers"]

    # Public API (no auth) on the api domain. /metrics is deliberately excluded:
    # it is scraped by Prometheus directly on the internal network (app:8080).
    app:
      rule: 'Host(`{{ env "API_DOMAIN" }}`) && !PathPrefix(`/metrics`)'
      entryPoints: ['{{ env "TRAEFIK_ENTRYPOINT" }}']
      service: app

    # Public web client (no auth) on its own domain; it reaches the API cross
    # origin, which the API's CORS allowlist has to accept.
    web:
      rule: 'Host(`{{ env "WEB_DOMAIN" }}`)'
      entryPoints: ['{{ env "TRAEFIK_ENTRYPOINT" }}']
      service: web
      middlewares: ["web-security-headers"]
