# Mounted into the broker as conf.d/20-legnaris.conf. Written for RabbitMQ 4.4;
# re-read it when the pinned version in rabbitmq/Dockerfile changes.

# The console lives under its own prefix so the edge route on the operator's
# domain can pass the path through unchanged (BRK-07).
management.path_prefix = /rabbitmq

# The metrics listener keeps its documented port, stated here because the
# monitoring configuration scrapes it (BRK-13).
prometheus.tcp.port = 15692
