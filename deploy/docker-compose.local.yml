# =============================================================================
# Local development override — expose the stack via Cloudflare Tunnel.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Differences from production (docker-compose.yml):
#   - Traefik uses the shared static config (traefik.yml) with plain HTTP on the
#     `web` entrypoint and no Let's Encrypt (Cloudflare Tunnel terminates TLS).
#   - oauth2-proxy sets non-secure cookies (the origin is HTTP behind the tunnel;
#     the browser still sees HTTPS via Cloudflare).
#   - cloudflared exposes api.*, app.* and ops.* through the tunnel.
# =============================================================================

services:
  traefik:
    # Drop the production-only TLS flags from the base command; keep the same
    # traefik.yml (which already ships the `web` and `metrics` entrypoints).
    command:
      - --configFile=/etc/traefik/traefik.yml
    environment:
      API_DOMAIN: ${API_DOMAIN}
      OPS_DOMAIN: ${OPS_DOMAIN}
      TRAEFIK_ENTRYPOINT: web
    # Compose merges (appends) lists across files by default, so without this
    # tag the base `443:443` port and the `letsencrypt` volume would silently
    # carry over. !override replaces the inherited list instead of appending,
    # so the volumes below copy the base `traefik` mounts (minus the
    # production-only `letsencrypt` volume): if the base service gains a mount,
    # re-list it here too or it will be silently dropped in this override.
    # Requires Docker Compose >= 2.24.
    ports: !override
      - "80:80"
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro

  oauth2-proxy:
    # Compose merges `environment` maps (base + override), so this only relaxes
    # the secure-cookie flag for the HTTP origin behind the tunnel; every other
    # OAUTH2_PROXY_* comes from the base. networks/depends_on are merged too.
    environment:
      OAUTH2_PROXY_COOKIE_SECURE: "false"

  # Named Cloudflare Tunnel. Requires the tunnel + credentials created first
  # (see deploy/README.md, "Run locally via Cloudflare Tunnel"). Quick check:
  #   docker run --rm --network legnaris-prod_edge cloudflare/cloudflared:2026.9.1 \
  #     tunnel --no-autoupdate --url http://traefik:80
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    # The Docker embedded resolver forwards to the host's resolver, which on
    # some hosts answers SRV queries in compressed form; cloudflared's Go
    # resolver rejects those (golang/go#27546) and edge discovery fails with a
    # "Parse error" / i/o timeout, so the tunnel never connects. Pinning a
    # public resolver here keeps _v2-origintunneld._tcp.argotunnel.com usable.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ~/.cloudflared:/home/nonroot/.cloudflared:ro
    networks:
      - edge
    depends_on:
      - traefik
