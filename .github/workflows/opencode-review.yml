name: AI PR Review

# Triggered manually by commenting "ai-review" on a pull request.
# The review is advisory: it posts a comment but never blocks the merge.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Run only for comments on PRs (not plain issues) with the exact body.
    if: github.event.issue.pull_request && github.event.comment.body == 'ai-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head so AGENTS.md reflects the PR branch.
          ref: refs/pull/${{ github.event.issue.number }}/head

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode CLI
        run: npm install --global @opencode/cli

      - name: Generate PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ github.event.issue.number }}
          # Written inside the workspace so the review subagents can read it
          # (prompt attachments are not inherited by child sessions).
          mkdir -p .ai-review
          gh api "repos/${{ github.repository }}/pulls/${PR}" \
            -H "Accept: application/vnd.github.v3.diff" > .ai-review/diff.txt
          echo "diff lines: $(wc -l < .ai-review/diff.txt)"

      - name: Run AI review
        id: review
        continue-on-error: true
        env:
          # OpenCode Console API key for the `opencode` provider.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          # The orchestration itself lives in the agent files under
          # .opencode/agents/review/ (one specialist per review section).
          opencode run --standalone \
            --agent review/orchestrator \
            --model opencode/mimo-v2.6-flash-free \
            --file .ai-review/diff.txt \
            --file AGENTS.md \
            "Orchestrate the AI PR review for the attached diff now. Output only the final Markdown comment." \
            > /tmp/review.md 2>/tmp/review.log

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ github.event.issue.number }}
          if [ -s /tmp/review.md ]; then
            gh pr comment "${PR}" --body-file /tmp/review.md
          else
            gh pr comment "${PR}" --body \
              "AI review failed. See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
