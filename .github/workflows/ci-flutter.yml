name: Flutter CI

# Desktop (Flutter) pipeline. Runs only for changes under desktop/ or to this
# workflow file; the Go pipeline (ci-lint.yml) ignores desktop/** via
# paths-ignore, so a change in one toolchain never triggers the other.
on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/ci-flutter.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/ci-flutter.yml'

permissions:
  contents: read

jobs:
  windows:
    name: analyze, test, build (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      # flutter-action reads the version from pubspec.yaml with yq, which is not
      # pre-installed on Windows runners (the action's own choco fallback is
      # unreliable), so install it explicitly beforehand.
      - name: Install yq
        run: choco install yq

      # The SDK version is pinned by desktop/pubspec.yaml (environment.flutter),
      # the single source of truth shared with local development.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: desktop/pubspec.yaml
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build windows
        run: flutter build windows --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: legnaris-desktop-windows
          path: desktop/build/windows/x64/runner/Release
          if-no-files-found: error
