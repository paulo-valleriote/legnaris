name: Web CI

# Client (React/Vite/TypeScript PWA) pipeline: quality gate and browser e2e,
# on pull requests that touch web/. Security scanners (Semgrep, osv-scanner,
# gitleaks, ZAP, Lighthouse) were removed as overkill for a small project;
# Dependabot still covers dependency updates.
on:
  pull_request:
    paths:
      - 'web/**'
      - '.zap/**'
      - '.github/workflows/ci-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, typecheck, tests, build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint (ESLint incl. anti-XSS rules)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit and rendering tests (coverage thresholds gate a regression)
        run: npm run test:coverage
      - name: Production build
        run: npm run build

  e2e:
    name: browser end-to-end and visual parity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install the Chromium engine
        run: npx playwright install --with-deps chromium
      # The Playwright webServer builds the client and serves the preview; every
      # spec runs — accessibility (axe), PWA installability/offline, document
      # security headers and the visual baseline comparison. The baselines under
      # e2e/baselines are committed, so a layout change fails the comparison
      # instead of passing vacuously (POL-01, POL-02, F10-T003, D1–D3).
      - name: Run the browser suite
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
