name: GitOps image bump

# After images are published from main, open a PR that pins the production
# overlay to that commit's immutable tag. Merging the PR is the deployment:
# Argo CD syncs it. Requires "Allow GitHub Actions to create pull requests" in
# the repository settings; no extra secret.
on:
  workflow_run:
    workflows: [Images]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Pin production images to the built commit
        run: |
          sed -i -E "s/newTag: sha-[0-9a-f]{40}/newTag: sha-${{ github.event.workflow_run.head_sha }}/" \
            deploy/k8s/overlays/production/kustomization.yaml

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: gitops/bump-images
          title: 'chore(deploy): bump production images to ${{ github.event.workflow_run.head_sha }}'
          commit-message: 'chore(deploy): bump production images to ${{ github.event.workflow_run.head_sha }}'
          body: |
            Pins `deploy/k8s/overlays/production` to the images built from
            ${{ github.event.workflow_run.head_sha }}. Merging deploys via Argo CD;
            reverting this PR rolls back.
          delete-branch: true
