name: Images

# Builds the `app` and `web` images, scans them with Trivy and publishes them to
# GHCR. Pull requests build and scan only (no push, no registry credentials);
# pushes to main and `v*` tags publish. The commit-SHA tag is the immutable
# reference clusters should pin; `v*` tags add a human-readable version tag.
on:
  # Pull requests build and scan only when something that changes the image
  # contents or its dependency set changes (Dockerfiles, lockfiles, rabbitmq);
  # plain source edits are covered by the Go and Web pipelines and by the
  # publish run on main. Keeps a metered free plan from paying for three image
  # builds on every commit.
  pull_request:
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'web/Dockerfile'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'deploy/rabbitmq/**'
      - '.github/workflows/ci-images.yml'
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    name: web Dockerfile hardening
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: hadolint (Dockerfile best practices)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: web/Dockerfile
          failure-threshold: warning
      # Trivy's IaC checks over the image definition. Blocking on CRITICAL only:
      # DS002 ("image user is root", HIGH) is an accepted property of the static
      # nginx image, whose master must start as root to bind port 80 and drops
      # its workers to the unprivileged `nginx` user.
      - name: Trivy config scan (IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: web
          severity: CRITICAL
          exit-code: '1'

  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
          - name: web
            context: web
          - name: rabbitmq
            context: deploy/rabbitmq
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/legnaris-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
