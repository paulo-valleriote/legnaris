name: Spec & Test Lints

# Lint rules promoted from the AI PR review (PR #58, "Promover a lint rule"):
#   1. no vacuous assertions in Dart tests            -> scripts/check_test_assertions.py
#   2. requirement IDs cited in code exist in the specs -> scripts/check_requirement_ids.py
#   3. validation.md file:line citations resolve      -> scripts/check_validation_citations.py
# Stdlib-only Python (no setup step); run the same checks locally with
# `make lint-specs`. Gated to pull requests only: rule 3 needs the PR base to
# scope its diff, and a merged PR has already passed.
#
# The rules read *.go / *.dart / *.ts / *.tsx sources plus the scripts and the
# .specs corpus, so those are the only changes that can break them (the client
# suffixes were added with the web PWA foundation, SEC-07).
on:
  pull_request:
    paths:
      - '**/*.go'
      - '**/*.dart'
      - 'web/**/*.ts'
      - 'web/**/*.tsx'
      - 'scripts/**'
      - '.specs/**'
      - '.github/workflows/ci-spec-lint.yml'

permissions:
  contents: read

concurrency:
  group: ci-spec-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lints:
    name: assertions, requirement ids, citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Rule 3 diffs the PR against its base to decide which citations it
          # owns (a validation.md the change touches is checked in full).
          fetch-depth: 0

      - name: lint script self-test
        run: python3 scripts/test_lints.py

      - name: rule 1 - no vacuous assertions in Dart/TS tests
        run: python3 scripts/check_test_assertions.py

      - name: rule 2 - requirement IDs cited in code exist in the specs
        run: python3 scripts/check_requirement_ids.py

      - name: rule 3 - validation.md file:line citations resolve
        run: python3 scripts/check_validation_citations.py --base "${{ github.event.pull_request.base.sha }}"
