name: CI

# One pipeline for every pull request. The `changes` job decides which suites
# the diff needs, so a docs-only PR spends no minutes on Go or the browser (the
# repository is on a metered free plan). Branch protection requires only the
# final `gate` job: it always runs, so a required check never hangs as
# "pending" when a path filter skips a suite, and it fails when any suite that
# did run failed or was cancelled. A merge to main re-runs nothing new, since
# the PR already passed this exact tree.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A title edit re-runs the workflow to re-check the title alone: the diff is
  # unchanged, so the path filter and every suite it feeds are skipped and only
  # `pr-title` and the gate spend a runner.
  changes:
    name: detect changed areas
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # `backend/**` is listed beyond `**/*.go` so non-Go assets it carries
          # (testdata, embedded files) still trigger the Go suites.
          filters: |
            go:
              - '**/*.go'
              - 'backend/**'
              - 'testdata/**'
              - 'deploy/**'
              - 'scripts/**'
              - '.githooks/**'
              # The versioned Claude Code settings wire the Bash secret guard and
              # the gitleaks config shapes the scan; both are gated here.
              - '.claude/**'
              - '.gitleaks.toml'
              # The English-only scanner reads the client's l10n catalogue and
              # is gated by the go-lint job; a pt-BR string added there must run it.
              - 'web/src/l10n/**'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            images:
              - 'Dockerfile'
              - '.dockerignore'
              - 'web/Dockerfile'
              - 'web/.dockerignore'
              - 'deploy/rabbitmq/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'

  # Branch protection requires the gate, so a pull request whose title names no
  # Jira card cannot merge: the key is what links the change back to the board.
  # It runs on every event, including a title edit that skips the diff suites.
  pr-title:
    name: PR title carries a Jira key
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Title names an LGN-<number> card
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: go run ./scripts/ci/cmd/pr-title-check

  go-lint:
    name: golangci-lint, tidy, mocks, shellcheck, deploy stack config
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13
          args: --new=false

      - name: No comments in Go or TS/TSX sources
        run: go run ./backend/cmd/nocomments

      # A dependency added as `// indirect` while a source imports it directly
      # stays harmless at build time but drifts from `go mod tidy`; this gate
      # keeps go.mod/go.sum canonical (mirrored by `make mod-check`).
      - name: go.mod is tidy
        run: go mod tidy -diff

      - name: "Test case names carry a Happy path, Edge or Error prefix"
        run: go run ./backend/cmd/testnames

      # Mocks are generated, so a hand-edit or an interface that changed without
      # a regeneration drifts silently: regenerating and diffing keeps them
      # exactly what mockery writes, and the scan keeps every mock under mocks/
      # carrying its generated header (mirrored by `make mocks-check`).
      - name: mocks are generated, current and confined to mocks/
        run: make mocks-check

      # The VPS deploy script runs as root-equivalent on the host and the dev
      # scripts and hooks gate local work; shellcheck catches quoting and
      # word-splitting bugs before they reach the VPS.
      - name: shellcheck
        run: shellcheck deploy/vps/*.sh deploy/cd/*.sh scripts/*.sh scripts/hooks/*.sh .githooks/pre-commit

      # The versioned hooks deny Bash commands that would print .env or the
      # GitHub token and block a stop on failing lint/tests; both suites prove
      # every denial, every sanctioned use and the change classification.
      - name: Claude Code hook tests (secret guard, stop verification)
        run: |
          scripts/hooks/guard-secrets_test.sh
          scripts/hooks/stop-verify_test.sh

      # English is the only language in code and UI copy (AGENTS.md). The
      # scanner reads every Go, TS/TSX and web/src/l10n source in the tracked
      # tree; a file is allow-listed only with a written reason.
      - name: English-only sources
        run: make english

      # Pinned release binary, checksum-verified, scanning the pull request's
      # working tree with the committed allow-list for fixture values.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact --config .gitleaks.toml .

      # Interpolate the whole stack against the committed .env.example (every
      # required variable is a non-empty placeholder), so a required var that
      # is not wired into a service, or a malformed compose file, fails the
      # build instead of only crashing the container at `up`.
      - name: docker compose config
        run: |
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config >/dev/null
          IMAGE_TAG=sha-0000000000000000000000000000000000000000 docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.vps.yml --env-file deploy/.env.example config >/dev/null

  go-race:
    name: Go tests (race detector)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # The Mongo suites and the transaction helper need a replica set with a
      # keyfile, which a `services:` container cannot express, so the job starts
      # the same rs0 that `make dev-db` runs locally. Without DATABASE_URI those
      # suites skip silently, hiding regressions.
      - name: Start MongoDB replica set rs0
        env:
          DATABASE_URI: mongodb://root:legnaris-ci-only@localhost:27017/?replicaSet=rs0&retryWrites=true&authSource=admin
        run: make dev-db
      - name: go test -race
        env:
          DATABASE_URI: mongodb://root:legnaris-ci-only@localhost:27017/?replicaSet=rs0&retryWrites=true&authSource=admin
        run: go test -race ./...

  # The race job mounts a replica set, so a suite that needs no service and one
  # that silently skips without it look identical there. This job runs the whole
  # tree with the service addresses explicitly empty: a test that needs a
  # database, broker or cache has to skip on its own rather than fail here.
  go-test-nodb:
    name: Go tests (no database, broker or cache)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: go test with no service addresses
        env:
          DATABASE_URI: ''
          RABBITMQ_URL: ''
          REDIS_URL: ''
        run: go test ./...

  # A behaviour change without a test is the review signal this job automates:
  # it pairs every changed Go package with a changed test in the same package and
  # every changed web source with a change under web/src/test/. The
  # `no-tests:refactor` label is the escape hatch for a change that keeps the
  # contract; it skips the check and records itself in the step summary.
  tests-required:
    name: changed code ships tests
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Every changed package ships a test change
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" | go run ./scripts/ci/cmd/tests-required

  web-quality:
    name: web format, lint, typecheck, tests, build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: No comments in Go or TS/TSX sources
        working-directory: .
        run: go run ./backend/cmd/nocomments
      - name: Format check
        run: npm run format:check
      - name: Lint (ESLint incl. anti-XSS rules)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit and rendering tests (coverage thresholds gate a regression)
        run: npm run test:coverage
      - name: Production build
        run: npm run build

  web-e2e:
    name: web browser end-to-end
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install the Chromium engine
        run: npx playwright install --with-deps chromium
      # The Playwright webServer builds the client and serves the preview; the
      # specs cover accessibility (axe), PWA installability/offline, document
      # security headers, responsive layout and the auth flows.
      - name: Run the browser suite
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  # Builds without pushing, so a broken Dockerfile fails the PR instead of the
  # `Images` run on main after the merge.
  images-build:
    name: image build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
          - name: web
            context: web
          - name: rabbitmq
            context: deploy/rabbitmq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}

  gate:
    name: gate
    needs: [changes, pr-title, go-lint, go-race, go-test-nodb, tests-required, web-quality, web-e2e, images-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required suite passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a suite ended as '$result'"; exit 1 ;;
            esac
          done
