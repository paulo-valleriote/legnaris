name: Lint & Race

on:
  pull_request:
    # Flutter lives only under desktop/ and is covered by ci-flutter.yml;
    # a desktop-only change must not trigger this Go pipeline.
    paths-ignore:
      - 'desktop/**'

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --new=false

  race:
    name: tests (race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race ./...