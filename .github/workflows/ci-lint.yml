name: Lint & Race

# Pull requests only: a merge to main re-runs nothing new, since the PR already
# passed this exact tree (the repository is on a metered free plan). Allowlist,
# not paths-ignore (the two cannot coexist on one event): this pipeline owns
# the Go toolchain and the deploy stack only. A docs/web/spec change touches
# neither, so it must not trigger this pipeline. `backend/cmd/**`,
# `backend/internal/**` and `backend/shared/**` are listed beyond `**/*.go` so
# non-Go assets they may carry (testdata, embedded files) still trigger it.
on:
  pull_request:
    paths:
      - '**/*.go'
      - 'backend/cmd/**'
      - 'backend/internal/**'
      - 'backend/shared/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/ci-lint.yml'

permissions:
  contents: read

concurrency:
  group: ci-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint, tidy, deploy stack config, shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13
          args: --new=false

      # A dependency added as `// indirect` while a source imports it directly
      # stays harmless at build time but drifts from `go mod tidy`; this gate
      # keeps go.mod/go.sum canonical (mirrored by `make mod-check`).
      - name: go.mod is tidy
        run: go mod tidy -diff

      # The VPS deploy script runs as root-equivalent on the host and the dev
      # scripts gate local work; shellcheck catches quoting and word-splitting
      # bugs before they reach the VPS. Covers every shell file in those areas.
      - name: shellcheck
        run: shellcheck deploy/vps/*.sh deploy/cd/*.sh scripts/*.sh

      # Interpolate the whole stack against the committed .env.example (every
      # required variable is a non-empty placeholder), so a required var that
      # is not wired into a service — or a malformed compose file — fails the
      # build instead of only crashing the container at `up`.
      - name: docker compose config
        run: |
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config >/dev/null
          IMAGE_TAG=sha-0000000000000000000000000000000000000000 docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.vps.yml --env-file deploy/.env.example config >/dev/null

  race:
    name: tests (race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race ./...
