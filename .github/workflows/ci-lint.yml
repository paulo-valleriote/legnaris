name: Lint & Race

on:
  pull_request:
    # Flutter lives only under desktop/ and is covered by ci-flutter.yml;
    # a desktop-only change must not trigger this Go pipeline.
    paths-ignore:
      - 'desktop/**'

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --new=false

  race:
    name: tests (race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race ./...

  compose:
    name: deploy stack config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Interpolate the whole stack against the committed .env.example (every
      # required variable is a non-empty placeholder), so a required var that
      # is not wired into a service — or a malformed compose file — fails the
      # build instead of only crashing the container at `up`.
      - name: docker compose config (base + local override)
        run: |
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config >/dev/null
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml --env-file deploy/.env.example config >/dev/null
