name: AI PR Review

# Triggered manually by commenting "ai-review" on a pull request.
# The review is advisory: it posts a comment but never blocks the merge.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Run only for comments on PRs (not plain issues) with the exact body.
    if: github.event.issue.pull_request && github.event.comment.body == 'ai-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the PR head so AGENTS.md reflects the PR branch.
          ref: refs/pull/${{ github.event.issue.number }}/head

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install OpenCode CLI
        run: npm install --global @opencode/cli

      - name: Generate PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ github.event.issue.number }}
          # Written inside the workspace so the review subagents can read it
          # (prompt attachments are not inherited by child sessions).
          mkdir -p .ai-review
          gh api "repos/${{ github.repository }}/pulls/${PR}" \
            -H "Accept: application/vnd.github.v3.diff" > .ai-review/diff.txt
          echo "diff lines: $(wc -l < .ai-review/diff.txt)"

      - name: Fetch PR card
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: https://paulovalleriotedev.atlassian.net
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          PR=${{ github.event.issue.number }}
          mkdir -p .ai-review
          TITLE=$(gh api "repos/${{ github.repository }}/pulls/${PR}" --jq .title || true)
          BODY=$(gh api "repos/${{ github.repository }}/pulls/${PR}" --jq .body || true)
          KEY=$(printf '%s\n%s\n' "$TITLE" "$BODY" | grep -oE 'LGN-[0-9]+' | head -1 || true)
          if [ -z "${KEY}" ]; then
            echo "No card" > .ai-review/card.md
            exit 0
          fi
          AUTH=$(printf '%s' "${JIRA_EMAIL}:${JIRA_API_TOKEN}" | base64 -w0)
          if curl -fsS -H "Authorization: Basic ${AUTH}" \
              "${JIRA_BASE_URL}/rest/api/3/issue/${KEY}?fields=summary,description" \
              -o /tmp/card.json; then
            {
              echo "# ${KEY}"
              jq -r '[.. | .text? // empty] | join("\n")' <(jq '.fields.description' /tmp/card.json)
            } > .ai-review/card.md
          else
            echo "Card unavailable" > .ai-review/card.md
          fi
          echo "card: $(head -1 .ai-review/card.md)"

      - name: Run AI review
        id: review
        continue-on-error: true
        env:
          # OpenCode Console API key for the `opencode` provider.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          # The orchestration contract lives in the agent file; the prompt only
          # points at it (prompt attachments are not inherited by child sessions,
          # so every input is a workspace file).
          PROMPT="First read .opencode/agents/review/orchestrator.md and follow it as the orchestration contract. Orchestrate the AI PR review for the attached diff now, including the Card compliance section. Output only the final Markdown comment."
          run_review() {
            opencode run --standalone \
              --agent build \
              --model "$1" \
              --file .ai-review/diff.txt \
              --file AGENTS.md \
              --file .ai-review/card.md \
              "${PROMPT}" > /tmp/review.md 2>>/tmp/review.log
          }
          if ! run_review "opencode-go/glm-5.3-flash" || [ ! -s /tmp/review.md ]; then
            echo "GLM unavailable, falling back to free" >> /tmp/review.log
            run_review "opencode/mimo-v2.6-flash-free"
          fi

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ github.event.issue.number }}
          if [ -s /tmp/review.md ]; then
            gh pr comment "${PR}" --body-file /tmp/review.md
          else
            gh pr comment "${PR}" --body \
              "AI review failed. See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
