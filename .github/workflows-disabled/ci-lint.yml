name: Lint & Race

on:
  pull_request:
    # Allowlist, not paths-ignore (the two cannot coexist on one event): this
    # pipeline owns the Go toolchain and the deploy stack only. A docs/web/spec
    # change touches neither, so it must not trigger this pipeline. `backend/cmd/**`,
    # `backend/internal/**` and `backend/shared/**` are listed beyond `**/*.go` so
    # non-Go assets they may carry (testdata, embedded files) still trigger it.
    paths:
      - '**/*.go'
      - 'backend/cmd/**'
      - 'backend/internal/**'
      - 'backend/shared/**'
      - 'deploy/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/ci-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --new=false

      # A dependency added as `// indirect` while a source imports it directly
      # stays harmless at build time but drifts from `go mod tidy`; this gate
      # keeps go.mod/go.sum canonical (mirrored by `make mod-check`).
      - name: go.mod is tidy
        run: go mod tidy -diff

  race:
    name: tests (race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race ./...

  compose:
    name: deploy stack config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Interpolate the whole stack against the committed .env.example (every
      # required variable is a non-empty placeholder), so a required var that
      # is not wired into a service — or a malformed compose file — fails the
      # build instead of only crashing the container at `up`.
      - name: docker compose config (base + local override)
        run: |
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config >/dev/null
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml --env-file deploy/.env.example config >/dev/null
